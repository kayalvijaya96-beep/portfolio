name: Portfolio CI & Build Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify Portfolio
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Build (Vite + Tailwind CSS)
      run: npm run build

    - name: Verify Dist Artifact
      run: |
        test -d dist || { echo "Build artifact 'dist' not found!"; exit 1; }
        echo "Build successfully verified!"

